<!DOCTYPE html>
<html>
<head>
    <title>Simple Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>Automatic CSV Dashboard</h1>

    {% for chart in charts %}
        <div id="chart-{{ forloop.counter }}" style="height:400px;"></div>
        <script>
            var trace = {
                x: {{ chart.x|safe }},
                y: {{ chart.y|safe }},
                type: 'scatter',
                mode: 'lines+markers',
                name: "{{ chart.name }}"
            };
            Plotly.newPlot('chart-{{ forloop.counter }}', [trace]);
        </script>
    {% endfor %}
</body>
</html>
