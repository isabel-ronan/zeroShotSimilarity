{% extends "dashboard/base.html" %}

{% block title %}Individual Dashboard{% endblock %}

{% block content %}

<h1>Person Dashboard</h1>

<form method="get">
    <label for="person">Select Person:</label>
    <select name="person" onchange="this.form.submit()">
        {% for p in persons %}
            <option value="{{ p }}" {% if p == selected_person %}selected{% endif %}>
                {{ p }}
            </option>
        {% endfor %}
    </select>
    <label for="normalize">Scale:</label>
    <select name="normalize" onchange="this.form.submit()">
            <option value="norm" {% if selected_norm == "norm" %}selected{% endif %}>
                Normalized
            </option>
            <option value="not-norm" {% if selected_norm == "not-norm" %}selected{% endif %}>
                Not Normalized
            </option>
    </select>
</form>

<hr>

<div>
    {{ graph|safe }}
</div>

{% endblock %}
