<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Dashboard{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="header">
    <a href="{% url 'dashboard' %}">Individual Dashboard</a>
    <a href="{% url 'demographics' %}">Demographics Comparison</a>
    <a href="{% url 'medications' %}">Medications</a>
</div>

<div class="content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
